<svg width="680" height="650" viewBox="0 0 680 650" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Fluxo simplificado da solução de agentes autônomos</title>
<desc>Um sinal real é detectado pelo agent-preditivo, que abre uma issue no GitHub. O agent-local implementa a correção e calcula um score de risco, que decide entre merge automático ou PR para revisão humana.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="680" height="650" fill="#F1EFE8"/>

<g>
  <rect x="200" y="40" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="58" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Sinal real</text>
  <text x="340" y="76" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">latência, chaos, gap de negócio</text>
</g>
<line x1="340" y1="96" x2="340" y2="136" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="200" y="136" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="154" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">agent-preditivo</text>
  <text x="340" y="172" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">LLM local classifica o sinal</text>
</g>
<line x1="340" y1="192" x2="340" y2="232" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="200" y="232" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="250" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Issue no GitHub</text>
  <text x="340" y="268" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">bug ou oportunidade</text>
</g>
<line x1="340" y1="288" x2="340" y2="328" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="200" y="328" width="280" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="340" y="346" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">agent-local</text>
  <text x="340" y="364" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">corrige via Claude Agent SDK</text>
</g>
<line x1="340" y1="384" x2="340" y2="424" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <polygon points="340,424 450,469 340,514 230,469" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="340" y="463" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402">Score de risco</text>
  <text x="340" y="481" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#854F0B">abaixo do threshold?</text>
</g>

<path d="M230 469 L230 500 L155 500 L155 554" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M450 469 L450 500 L505 500 L505 554" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="60" y="554" width="190" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="155" y="572" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Merge automático</text>
  <text x="155" y="590" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">decisão autônoma</text>
</g>

<g>
  <rect x="390" y="554" width="230" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="505" y="572" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">PR + revisão humana</text>
  <text x="505" y="590" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">decisão do operador</text>
</g>
</svg>
